# Render : les comptes ont besoin d'un disque persistant, disponible à partir
# de l'offre « Starter » (payante). Sur l'offre gratuite, la base serait
# effacée à chaque redémarrage.
services:
  - type: web
    name: explisite
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: explisite-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: ENCRYPTION_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OWNER_NAME
        sync: false
      - key: OWNER_STATUS
        sync: false
      - key: OWNER_ADDRESS
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: SITE_URL
        sync: false
      - key: HOSTING_PROVIDER
        value: "Render Services, Inc. — 525 Brannan Street, Suite 300, San Francisco, CA 94107, États-Unis"
      - key: TRUST_PROXY
        value: "1"
