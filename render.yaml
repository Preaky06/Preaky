# Déploiement en un clic sur Render (https://render.com) : New → Blueprint → choisir ce dépôt.
services:
  - type: web
    name: operation-taupe
    runtime: node
    rootDir: operation-taupe
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
