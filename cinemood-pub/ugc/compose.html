<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: 'Archivo'; font-weight: 500; src: url(/fonts/archivo-500.woff2) format('woff2'); }
@font-face { font-family: 'Archivo'; font-weight: 600; src: url(/fonts/archivo-600.woff2) format('woff2'); }
@font-face { font-family: 'Archivo'; font-weight: 700; src: url(/fonts/archivo-700.woff2) format('woff2'); }
@font-face { font-family: 'Archivo'; font-weight: 800; src: url(/fonts/archivo-800.woff2) format('woff2'); }
html, body { margin: 0; background: #000; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
'use strict';
const W = 1080, H = 1920, STATUS = 112, URLBAR = 148, NAV = 48, SITE_Y = STATUS + URLBAR;
const C = document.getElementById('c'), X = C.getContext('2d');
const S = document.createElement('canvas'); S.width = W; S.height = H;
const SX = S.getContext('2d');
const EMO = "'Noto Color Emoji'";
const cache = new Map();
function img(src) {
  if (cache.has(src)) return cache.get(src);
  const p = new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
  cache.set(src, p);
  if (cache.size > 6) cache.delete(cache.keys().next().value);
  return p;
}
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const easeOut = (u) => 1 - Math.pow(1 - clamp(u), 3);
const easeIO = (u) => { u = clamp(u); return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; };
function rr(x, a, b, w, h, r) { x.beginPath(); x.roundRect(a, b, w, h, r); }

function statusBar(x, bg) {
  x.fillStyle = bg; x.fillRect(0, 0, W, STATUS);
  x.fillStyle = '#f2f2f2';
  x.font = '600 38px Archivo'; x.textBaseline = 'middle'; x.textAlign = 'left';
  x.fillText('21:47', 58, 62);
  // réseau, wifi, batterie
  const bx = 870;
  for (let i = 0; i < 4; i++) { x.globalAlpha = i < 3 ? 1 : 0.35; rr(x, bx + i * 13, 74 - (i + 1) * 8, 9, (i + 1) * 8, 2); x.fill(); }
  x.globalAlpha = 1;
  x.save(); x.translate(948, 78); x.fillStyle = '#f2f2f2';
  x.beginPath(); x.moveTo(0, 0); x.arc(0, 0, 30, -Math.PI * 0.75, -Math.PI * 0.25); x.closePath(); x.fill(); x.restore();
  x.strokeStyle = '#f2f2f2'; x.lineWidth = 3; rr(x, 984, 48, 50, 28, 7); x.stroke();
  x.fillStyle = '#f2f2f2'; rr(x, 989, 53, 30, 18, 3); x.fill(); rr(x, 1036, 56, 5, 12, 2); x.fill();
}
function navBar(x, bg) {
  x.fillStyle = bg; x.fillRect(0, H - NAV, W, NAV);
  x.fillStyle = 'rgba(255,255,255,0.55)'; rr(x, W / 2 - 108, H - NAV / 2 - 4, 216, 8, 4); x.fill();
}
function urlBar(x, u) {
  x.fillStyle = '#100a0d'; x.fillRect(0, STATUS, W, URLBAR);
  const fx = 40, fy = STATUS + 26, fw = u.focus ? W - 80 : W - 260, fh = 96;
  x.fillStyle = u.focus ? '#3a3035' : '#2a2226'; rr(x, fx, fy, fw, fh, 48); x.fill();
  x.textBaseline = 'middle'; x.textAlign = 'left';
  // icône de gauche : réglages du site (repos) ou loupe (saisie)
  x.strokeStyle = '#d9d2d5'; x.lineWidth = 4; x.lineCap = 'round';
  if (u.focus) { x.beginPath(); x.arc(fx + 54, fy + 44, 14, 0, Math.PI * 2); x.stroke(); x.beginPath(); x.moveTo(fx + 65, fy + 55); x.lineTo(fx + 76, fy + 66); x.stroke(); }
  else { for (const [yy, a] of [[fy + 36, 0.35], [fy + 60, 0.65]]) { x.beginPath(); x.moveTo(fx + 36, yy); x.lineTo(fx + 76, yy); x.stroke(); x.fillStyle = '#d9d2d5'; x.beginPath(); x.arc(fx + 36 + 40 * a, yy, 8, 0, Math.PI * 2); x.fill(); } }
  const txt = u.text, tx = fx + 108;
  x.font = '500 40px Archivo';
  if (txt) { x.fillStyle = '#f4eff1'; x.fillText(txt, tx, fy + 50); }
  else if (u.focus) { x.fillStyle = 'rgba(244,239,241,.45)'; x.fillText('Rechercher ou saisir une adresse', tx, fy + 50); }
  if (u.cursor) { const cw = txt ? x.measureText(txt).width : 0; x.fillStyle = '#8ab4f8'; x.fillRect(tx + cw + 3, fy + 26, 4, 48); }
  if (!u.focus) {
    // onglets et menu
    x.strokeStyle = '#e8e1e4'; x.lineWidth = 4; rr(x, W - 186, fy + 26, 46, 46, 9); x.stroke();
    x.fillStyle = '#e8e1e4'; x.font = '700 26px Archivo'; x.textAlign = 'center'; x.fillText('3', W - 163, fy + 50);
    for (let i = 0; i < 3; i++) { x.beginPath(); x.arc(W - 74, fy + 26 + i * 22, 5.5, 0, Math.PI * 2); x.fill(); }
    x.textAlign = 'left';
  }
  if (u.progress != null) { x.fillStyle = '#8ab4f8'; x.fillRect(0, STATUS + URLBAR - 6, W * (0.12 + 0.88 * easeOut(u.progress)), 6); }
}
function suggestion(x, text) {
  if (text.length < 4) return;
  const y = SITE_Y + 18;
  x.fillStyle = '#1b1417'; x.fillRect(0, SITE_Y, W, 160);
  x.strokeStyle = '#cfc6ca'; x.lineWidth = 3.5;
  x.beginPath(); x.arc(92, y + 62, 24, 0, Math.PI * 2); x.stroke();
  x.beginPath(); x.ellipse(92, y + 62, 11, 24, 0, 0, Math.PI * 2); x.stroke();
  x.beginPath(); x.moveTo(68, y + 62); x.lineTo(116, y + 62); x.stroke();
  x.textBaseline = 'alphabetic'; x.textAlign = 'left';
  x.font = '600 40px Archivo'; x.fillStyle = '#f4eff1'; x.fillText('cinem00d.com', 156, y + 56);
  x.font = '500 30px Archivo'; x.fillStyle = 'rgba(244,239,241,.6)'; x.fillText('CinéMood — le bon film pour ton moment', 156, y + 102);
}
function finger(x, cx, cy, a, ring) {
  if (a <= 0) return;
  x.save(); x.globalAlpha = a;
  x.fillStyle = 'rgba(255,255,255,0.42)'; x.beginPath(); x.arc(cx, cy, 44, 0, Math.PI * 2); x.fill();
  x.strokeStyle = 'rgba(255,255,255,0.7)'; x.lineWidth = 3; x.beginPath(); x.arc(cx, cy, 44, 0, Math.PI * 2); x.stroke();
  x.restore();
  if (ring != null) {
    x.save(); x.globalAlpha = (1 - ring) * 0.8; x.strokeStyle = '#fff'; x.lineWidth = 5;
    x.beginPath(); x.arc(cx, cy, 44 + ring * 70, 0, Math.PI * 2); x.stroke(); x.restore();
  }
}
function wrap(x, text, maxW) {
  // un émoji reste collé au mot qui le précède
  const words = [];
  for (const w of text.split(' ')) { if (words.length && /^\p{Extended_Pictographic}/u.test(w)) words[words.length - 1] += '\u00a0' + w; else words.push(w); }
  const lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (x.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  lines.push(cur);
  if (lines.length !== 2) return lines;
  // deux lignes : coupure qui équilibre les longueurs
  let best = null;
  for (let k = 1; k < words.length; k++) {
    const a = words.slice(0, k).join(' '), b = words.slice(k).join(' ');
    const m = Math.max(x.measureText(a).width, x.measureText(b).width);
    if (m <= maxW && (!best || m < best.m)) best = { m, l: [a, b] };
  }
  return best ? best.l : lines;
}
function caption(x, text, age, cy) {
  const pop = age < 7 ? (age < 4 ? 0.82 + 0.24 * easeOut(age / 4) : 1.06 - 0.06 * easeOut((age - 4) / 3)) : 1;
  const a = clamp(age / 2.5);
  x.save(); x.globalAlpha = a;
  x.translate(W / 2, cy); x.scale(pop, pop);
  x.font = `700 50px Archivo, ${EMO}`; x.textBaseline = 'middle'; x.textAlign = 'center';
  const lines = wrap(x, text, 880), lh = 72;
  const y0 = -((lines.length - 1) * lh) / 2;
  x.fillStyle = '#fff';
  lines.forEach((l, i) => { const w = x.measureText(l).width + 46; rr(x, -w / 2, y0 + i * lh - 38, w, 76, 16); x.fill(); });
  x.fillStyle = '#111';
  lines.forEach((l, i) => x.fillText(l, 0, y0 + i * lh + 2));
  x.restore();
}
function pill(x, text, px, py, align, size) {
  x.font = `700 ${size}px Archivo, ${EMO}`; x.textBaseline = 'middle'; x.textAlign = 'left';
  const h = size * 1.75, w = x.measureText(text).width + size * 1.3;
  const left = align === 'right' ? px - w : align === 'center' ? px - w / 2 : px;
  x.fillStyle = 'rgba(0,0,0,0.6)'; rr(x, left, py, w, h, h / 2); x.fill();
  x.fillStyle = 'rgba(255,255,255,0.9)'; x.fillText(text, left + size * 0.65, py + h / 2 + 1);
}

/* une image du film : s = état calculé côté Node */
window.renderFrame = async function (s) {
  const x = SX;
  const bg = s.kind === 'hook' ? '#0b0c10' : '#100a0d';
  x.fillStyle = bg; x.fillRect(0, 0, W, H);
  if (s.img) {
    const im = await img('/raw/' + s.img);
    x.drawImage(im, 0, s.kind === 'hook' ? STATUS : SITE_Y);
  }
  if (s.kind !== 'hook') { urlBar(x, s.url || { text: 'cinem00d.com' }); if (s.kind === 'blank' && s.url) suggestion(x, s.url.text); }
  statusBar(x, bg); navBar(x, bg);
  for (const t of s.touches) finger(x, t.x, t.y, t.a, t.ring);
  // zoom de montage sur l'écran entier
  X.fillStyle = '#000'; X.fillRect(0, 0, W, H);
  X.save();
  X.translate(s.zoom.fx, s.zoom.fy); X.scale(s.zoom.z, s.zoom.z); X.translate(-s.zoom.fx, -s.zoom.fy);
  X.drawImage(S, 0, 0);
  X.restore();
  if (s.sticker) pill(X, s.sticker, W / 2, 760, 'center', 44);
  if (s.note) pill(X, s.note, W / 2, H - NAV - 72, 'center', 32);
  if (s.caption) caption(X, s.caption.text, s.caption.age, s.caption.y);
};
window.ready = document.fonts.load('700 50px Archivo').then(() => document.fonts.load('500 40px Archivo')).then(() => document.fonts.load('600 38px Archivo')).then(() => document.fonts.load(`50px ${EMO}`, '🎬'));
</script>
</body>
</html>
