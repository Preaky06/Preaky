name: Télécharger les affiches du motion design

on:
  push:
    branches: [claude/hopeful-albattani-gdrh72]
    paths:
      - motion/fetch-posters.js
      - .github/workflows/fetch-posters.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Télécharger les affiches depuis TMDB
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: |
          if [ -z "$TMDB_KEY" ]; then
            echo "::error::Secret TMDB_KEY absent : ajoute-le dans Settings > Secrets and variables > Actions, puis relance ce job."
            exit 1
          fi
          node motion/fetch-posters.js

      - name: Commiter les affiches
        # même si quelques affiches ont échoué, on garde celles qui sont arrivées
        if: success() || failure()
        run: |
          mkdir -p motion/posters
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add motion/posters
          if git diff --cached --quiet; then
            echo "Aucune nouvelle affiche."
          else
            git commit -m "Add TMDB posters for the motion design"
            git push
          fi
