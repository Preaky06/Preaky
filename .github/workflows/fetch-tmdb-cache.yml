name: Mettre en cache les réponses TMDB de la pub UGC

on:
  push:
    branches: [claude/hopeful-albattani-gdrh72]
    paths:
      - ugc/tmdb-requests.txt
      - ugc/fetch-tmdb-cache.js
      - .github/workflows/fetch-tmdb-cache.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Télécharger les réponses TMDB manquantes
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: node ugc/fetch-tmdb-cache.js

      - name: Commiter le cache
        if: success() || failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ugc/tmdb-cache
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Cache TMDB responses for the UGC ad"
            git push
          fi
